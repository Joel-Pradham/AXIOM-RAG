name: RAG Pipeline CI Evaluation

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  ragas_eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get install -y jq bc

      - name: Run Ragas Evaluation script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          # 1. Run the evaluation script, save stdout to a temp file
          python src/evaluate_rag.py > eval_output.txt
          cat eval_output.txt

          # 2. Parse out the JSON object located after '--- RAGAS RESULTS ---'
          JSON_BLOCK=$(awk '/--- RAGAS RESULTS ---/{flag=1; next} flag' eval_output.txt)

          # 3. Use jq to extract faithfulness metric
          FAITHFULNESS=$(echo "$JSON_BLOCK" | jq '.faithfulness')

          echo "Parsed Faithfulness: $FAITHFULNESS"

          # 4. Enforce strict faithfulness threshold
          FAILED=$(echo "$FAITHFULNESS < 0.85" | bc -l)
          if [ "$FAILED" -eq 1 ]; then
            echo "CI PIPELINE FAILED: Faithfulness ($FAITHFULNESS) is below threshold (0.85)!"
            exit 1
          else
            echo "CI PIPELINE PASSED: Faithfulness score is acceptable."
          fi
